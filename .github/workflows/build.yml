name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      # Coverage-Gates (Engine+Domain >= 90 %, Application+Persistence >= 80 %, Reporting >= 80 %) sind in den Testprojekten konfiguriert.
      - run: dotnet test -c Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: tests/**/TestResults/coverage.cobertura.xml

  windows:
    runs-on: windows-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version bestimmen
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: dotnet test -c Release
      - name: Publish Single-File
        run: dotnet publish src/PropTax.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }} -o publish/win-x64
      - name: Smoke-Test (Engine, Migration, PDF/XLSX, Verschlüsselung, Sicherung)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/win-x64/PropTax.App.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Selftest fehlgeschlagen ($($p.ExitCode))" }
          $files = Get-ChildItem publish/win-x64 -Exclude *.pdb
          if ($files.Count -ne 1) { throw "Erwartet genau eine Datei, gefunden: $($files.Name -join ', ')" }
          "{0:N1} MB" -f ((Get-Item publish/win-x64/PropTax.App.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: PropTax-win-x64
          path: publish/win-x64/PropTax.App.exe
      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/PropTax.App.exe
          body: |
            PropTax ${{ steps.v.outputs.version }} – Windows x64, eine Datei, keine Installation nötig.
            Hinweis: Erfassungs- und Berechnungswerkzeug, keine Steuerberatung. Siehe docs/handbuch.md.
